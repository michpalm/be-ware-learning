<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BeWare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@500;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* Layout: a marked-up field guide. Quiet paper and ink everywhere; fluorescent marker is
   reserved for whatever is being exposed (tricks), green marker for fair design. */
:root{
  --paper:#EDF0F6; --surface:#FFFFFF; --sunk:#E1E5EF; --ink:#151935; --muted:#484E6E; --line:#C3C9DB;
  --act:#2F33C2; --act-ink:#FFFFFF; --fair:#0B7444; --bad:#A3192B; --focus:#2F33C2;
  /* fixed in both themes: these sit on the phone bezel and on the loud simulations */
  --marker:#FFE14A; --marker-ink:#151935; --fair-hl:#8FEDB8; --bezel:#0B0D1F; --bezel-ink:#FFFFFF;
  --display:'Familjen Grotesk','Helvetica Neue',Arial,sans-serif;
  --ui:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --loud:'Lilita One','Arial Rounded MT Bold',Impact,'Arial Black',sans-serif;
  --sys:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --r:14px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1126; --surface:#191C3B; --sunk:#14173A; --ink:#ECEEFA; --muted:#AEB3D4; --line:#3A4070;
    --act:#A9ACFF; --act-ink:#0F1126; --fair:#72DDA6; --bad:#FF9CA8; --focus:#A9ACFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1126; --surface:#191C3B; --sunk:#14173A; --ink:#ECEEFA; --muted:#AEB3D4; --line:#3A4070;
  --act:#A9ACFF; --act-ink:#0F1126; --fair:#72DDA6; --bad:#FF9CA8; --focus:#A9ACFF;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 1rem)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.55 var(--ui);-webkit-text-size-adjust:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:.5rem;top:-4rem;background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:8px;z-index:50;font-weight:700}
.skip:focus{top:.5rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button,select,input{font:inherit;color:inherit}
h1,h2,h3,.h2{font-family:var(--display);text-wrap:balance}

/* marker highlight: the one bold device */
.hl{color:var(--marker-ink);padding:0 .12em;margin:0 -.04em;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  background:linear-gradient(100deg,transparent .12em,var(--marker) .12em calc(100% - .08em),transparent calc(100% - .08em)) 0 58%/100% 78% no-repeat}
@media (prefers-reduced-motion:no-preference){
  h1 .hl{animation:swipe .7s cubic-bezier(.3,.7,.2,1) .25s both}
  @keyframes swipe{from{background-size:0% 78%}to{background-size:100% 78%}}
}

/* chrome */
header.top,main,footer{max-width:1160px;margin:0 auto;padding-inline:1.25rem}
header.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-block:1rem}
.brand{background:none;border:0;padding:.2rem .1rem;cursor:pointer;font:700 1.5rem/1 var(--display);letter-spacing:-.02em;color:var(--ink);border-radius:6px}
.brand .hl{padding:0 .1em}
.tools{display:flex;gap:.6rem;align-items:center;font-size:.95rem;color:var(--muted)}
.tools select{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:.4rem .6rem;min-height:44px}
.tools select:hover{border-color:var(--ink)}
main{padding-block:1.5rem 4rem;outline:none}
footer{padding-block:1.25rem 2rem;border-top:1px solid var(--line);display:flex;gap:1rem;flex-wrap:wrap;justify-content:space-between;align-items:center;color:var(--muted);font-size:.95rem}
footer p{margin:0}
.linkbtn{background:none;border:0;padding:.6rem 0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:inherit;min-height:44px}
h1{font-size:clamp(2.2rem,5.6vw,3.9rem);line-height:1.02;letter-spacing:-.03em;margin:0 0 1rem;font-weight:700}
h1:focus,h2:focus{outline:none}
.h2{font-size:1.5rem;letter-spacing:-.015em;margin:3rem 0 1rem;font-weight:700}
.lead{font-size:1.2rem;max-width:56ch;margin:0}
.eyebrow{margin:0 0 .9rem;font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:2.5rem;align-items:center;padding-block:1.5rem 1rem}
.hero-ill svg{display:block;width:100%;max-width:250px;height:auto;margin-left:auto}
.ill-frame{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.ill-b{fill:var(--sunk)}
.ill-hl{fill:none;stroke:var(--marker);stroke-width:5}
.ill-fair{fill:none;stroke:var(--fair-hl);stroke-width:5}
.ill-dot{fill:var(--marker);stroke:var(--ink);stroke-width:2}
.ill-dot-f{fill:var(--fair-hl);stroke:var(--ink);stroke-width:2}
.ill-chk{fill:none;stroke:var(--marker-ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ill-n{fill:var(--marker-ink);font:700 13px var(--display);text-anchor:middle}
.how{list-style:none;counter-reset:h;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5rem}
.how li{counter-increment:h;display:grid;grid-template-columns:auto 1fr;column-gap:.85rem;row-gap:.2rem;align-items:baseline}
.how li::before{content:counter(h);grid-row:span 2;display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:50%;border:2px solid var(--ink);font:700 1.05rem/1 var(--display);align-self:start}
.how b{font:700 1.2rem/1.2 var(--display)}
.how span{color:var(--muted)}
.scns{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.25rem}
.scns li{display:flex}
.scn{display:flex;flex-direction:column;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;color:var(--ink)}
.scn:hover{border-color:var(--ink)}
.thumb svg{display:block;width:100%;height:auto;aspect-ratio:16/10}
.scn-b{display:grid;gap:.35rem;padding:1rem 1.1rem 1.15rem;flex:1;align-content:start}
.scn-b b{font:700 1.35rem/1.15 var(--display);letter-spacing:-.01em}
.scn-b>span{color:var(--muted)}
.tag{justify-self:start;margin-top:.35rem;font-size:.85rem;font-weight:700;color:var(--marker-ink);background:var(--marker);border-radius:999px;padding:.1rem .65rem}
.quizrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.1rem;align-items:center;width:100%;margin-top:1.25rem;text-align:left;background:transparent;border:2px dashed var(--line);border-radius:var(--r);padding:1rem 1.2rem;cursor:pointer;color:var(--ink)}
.quizrow:hover{border-color:var(--ink);border-style:solid}
.quizrow svg{width:52px;height:52px;display:block}
.quizrow .rtxt{display:grid;gap:.15rem}
.quizrow b{font:700 1.25rem/1.2 var(--display)}
.quizrow .rtxt span{color:var(--muted)}
.q-box{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.q-tick{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.q-line{fill:var(--line)}
.q-hl{fill:var(--marker)}

/* scenario */
.back{display:inline-flex;align-items:center;gap:.4rem;background:none;border:0;padding:.5rem 0;min-height:44px;margin-bottom:.25rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:700;color:var(--ink)}
.stepper{list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;padding:0;margin:0 0 1.75rem;max-width:620px}
.stepper li{counter-increment:s;display:flex}
.stepper button{display:flex;gap:.55rem;align-items:center;width:100%;background:none;border:0;border-bottom:5px solid var(--line);padding:.45rem .1rem .55rem;min-height:48px;cursor:pointer;font-weight:700;color:var(--muted);text-align:left;line-height:1.2}
.stepper button::before{content:counter(s);flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid currentColor;font:700 .95rem/1 var(--display)}
.stepper button[aria-current="step"]{border-bottom-color:var(--ink);color:var(--ink)}
.stepper button[aria-current="step"]::before{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.stepper button:not(:disabled):not([aria-current]):hover{color:var(--ink);border-bottom-color:var(--muted)}
.stepper button:disabled{opacity:.55;cursor:not-allowed}
.split{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:3rem;align-items:start}
.phonewrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 1rem);align-self:start}
.phone{background:var(--bezel);border-radius:38px;padding:0 9px 9px;box-shadow:0 0 0 1.5px var(--line),0 18px 40px -18px rgba(11,13,31,.55)}
.simbar{color:var(--bezel-ink);font-size:.8rem;font-weight:700;letter-spacing:.02em;padding:.7rem 1.4rem .6rem;text-align:center;line-height:1.3}
.scroll{height:min(640px,calc(100svh - 8rem));overflow-y:auto;overscroll-behavior:contain;border-radius:28px;background:#000}
.stage-wrap{position:relative}
.overlay{position:absolute;inset:0;pointer-events:none}

/* overlay: markers (See it) and flag targets (Resist it). Fixed colours: they sit on the simulations. */
.mark{position:absolute;outline:4px solid var(--marker);outline-offset:1px;box-shadow:0 0 0 7px rgba(11,13,31,.85);border-radius:8px}
.mark.on{outline-width:6px;background:rgba(255,225,74,.28)}
.mark.fair{outline-color:var(--fair-hl)}
.mark.fair.on{background:rgba(143,237,184,.25)}
.badge{position:absolute;left:-10px;top:-10px;min-width:28px;height:28px;border-radius:14px;background:var(--marker);color:var(--marker-ink);border:2px solid var(--bezel);display:grid;place-items:center;font:700 .95rem/1 var(--display);padding:0 .3rem}
.mark.fair .badge{background:var(--fair-hl)}
.edge .badge{left:6px;top:6px}
.hit{position:absolute;pointer-events:auto;border:0;padding:0;cursor:pointer;background:rgba(255,255,255,.05);outline:2px dashed #fff;outline-offset:0;box-shadow:0 0 0 4px rgba(11,13,31,.7);border-radius:8px}
.hit:hover{background:rgba(255,225,74,.18)}
.hit.on{background:rgba(255,225,74,.32);outline:4px solid var(--marker);box-shadow:0 0 0 7px rgba(11,13,31,.85)}
.hit.found{background:rgba(143,237,184,.28);outline:4px solid var(--fair-hl);box-shadow:0 0 0 7px rgba(11,13,31,.85)}
.hit.missed{background:rgba(255,255,255,.08);outline:4px dashed var(--marker);box-shadow:0 0 0 7px rgba(11,13,31,.85)}
.hit.wrong{background:rgba(255,120,130,.28);outline:4px solid #FF8A95;box-shadow:0 0 0 7px rgba(11,13,31,.85)}
.hit:focus-visible{outline:4px solid #fff;box-shadow:0 0 0 4px var(--bezel),0 0 0 9px #8EA2FF}
.hit.found .badge{background:var(--fair-hl)}
.hit.wrong .badge{background:#FF8A95}

/* panel */
.panel{min-width:0}
.panel>h2{font-size:1.9rem;margin:0 0 .6rem;letter-spacing:-.02em;line-height:1.1}
.panel>p{max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;padding:.55rem 1.1rem;border:2px solid var(--ink);border-radius:10px;background:transparent;color:var(--ink);font-weight:700;cursor:pointer}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--act);color:var(--act-ink);border-color:var(--act)}
.btn.primary:hover{background:color-mix(in srgb,var(--act) 86%,var(--ink))}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btns{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.4rem}
.hint{color:var(--muted)}
.cards{display:grid;gap:1rem;margin-top:1.25rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.25rem 1.2rem}
.card>header{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.card h3{margin:0;font-size:1.25rem;letter-spacing:-.01em;line-height:1.2}
.num{display:grid;place-items:center;min-width:32px;height:32px;padding:0 .35rem;border-radius:8px;background:var(--marker);color:var(--marker-ink);font:700 1.05rem/1 var(--display)}
.fairc .num{background:var(--fair-hl)}
.chip{font-size:.82rem;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:.05rem .6rem}
.say{font-size:1.2rem;font-weight:700;margin:.8rem 0 .9rem;line-height:1.38;max-width:52ch}
.wt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem 1.4rem}
.wt h4{margin:0 0 .15rem;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.wt p{margin:0}
.card p{margin:.4rem 0}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--line)}
.src{list-style:none;padding:0;margin:0;display:flex;gap:.4rem;flex-wrap:wrap}
.src li{font-size:.8rem;color:var(--muted);background:var(--sunk);border-radius:6px;padding:.1rem .5rem}
.count{font-weight:700}
.result{border:2px solid var(--ink);border-radius:var(--r);padding:1.1rem 1.25rem;margin:1.2rem 0;background:var(--surface)}
.result h3{margin:0 0 .4rem;font-size:1.3rem}
.result:focus{outline:3px solid var(--focus);outline-offset:3px}
.result ul{padding-left:1.2rem;margin:.4rem 0 0}
.legend{color:var(--muted);font-size:.95rem}
.decs>h3{font-size:1.4rem;margin:2rem 0 0}
.dec{border:0;padding:0;margin:1.2rem 0 0;min-width:0}
.dec legend{font-weight:700;padding:0;margin-bottom:.6rem;font-size:1.1rem;line-height:1.4}
.opt{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:.75rem 1rem;margin:0 0 .5rem;cursor:pointer;min-height:44px}
.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--act);background:color-mix(in srgb,var(--surface) 88%,var(--act));box-shadow:inset 4px 0 0 var(--act)}
.fb{min-height:1.5em;margin:.3rem 0 0;max-width:62ch}
.k-good{color:var(--fair)}.k-push{color:var(--bad)}.k-ok{color:var(--muted)}
.done{margin-top:2rem;padding:1.2rem 1.25rem;border-radius:var(--r);background:var(--sunk)}
.done h3{margin:0 0 .3rem;font-size:1.3rem}
.done p{margin:0}
.note{color:var(--muted);font-size:.95rem;max-width:62ch}

/* quiz */
.qform{max-width:720px}
fieldset.q{border:0;border-top:1px solid var(--line);padding:1.2rem 0;margin:0;min-width:0}
fieldset.q legend{font-weight:700;padding:0;float:left;width:100%;margin-bottom:.5rem;font-size:1.08rem}
fieldset.q legend+*{clear:left}
.qopt{display:flex;gap:.75rem;align-items:center;padding:.55rem .8rem;border:2px solid var(--line);border-radius:12px;margin:.45rem 0;background:var(--surface);min-height:48px;cursor:pointer}
.qopt:hover{border-color:var(--ink)}
.qopt input{width:22px;height:22px;flex:none;accent-color:var(--act);margin:0}
.qopt:has(input:checked){border-color:var(--act);box-shadow:inset 4px 0 0 var(--act)}
.err{color:var(--bad);font-weight:700}
.qres{padding-left:1.4rem;max-width:720px}
.qres li{margin:0 0 1.2rem}
.qres p{margin:.2rem 0}
.score{font:700 2.2rem/1.1 var(--display);margin:.2rem 0 .6rem;letter-spacing:-.02em}
.prose{max-width:66ch}
.prose h2{font-size:1.35rem;margin:2rem 0 .4rem}
.prose ul{padding-left:1.2rem}
.prose li{margin:.3rem 0}

/* ---------- simulations (deliberately loud, fixed colours, not themed) ---------- */
.sim{font-family:var(--sys);line-height:1.35;color-scheme:light;min-height:100%}
.sim p{margin:0}
.sim button{font-family:inherit}
.sim .tiny{font-size:.68rem;color:#9a9a9a}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:9px 20px 5px;font:600 .82rem/1 var(--sys)}
.sbar svg{width:58px;height:11px;fill:currentColor}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabbar{display:flex;padding:4px 4px 10px;border-top:1px solid}
.tab{flex:1;display:grid;justify-items:center;align-content:center;gap:2px;background:none;border:0;font-size:.68rem;font-weight:600;min-height:50px;cursor:pointer;color:inherit;opacity:.72}
.tab.on{opacity:1}
.sim:not([inert]) .tabbar{position:sticky;bottom:0;z-index:5}

/* game */
.sim-game{--g-bg:#1A0B4A;--g-card:#2D1572;--g-card2:#3D1E93;--g-acc:#FFD60A;--g-acc-d:#B08F00;--g-pink:#FF2E63;--g-tab:#12073A;background:var(--g-bg);color:#fff}
.gv-b{--g-bg:#06173D;--g-card:#0F2A66;--g-card2:#18408F;--g-acc:#FFB703;--g-acc-d:#B07A00;--g-pink:#FF4D8D;--g-tab:#04102B}
.g-hud{display:flex;align-items:center;gap:10px;padding:6px 12px 10px}
.g-av{position:relative;width:48px;height:48px;border-radius:14px;background:var(--g-card2);border:2px solid var(--g-acc);display:grid;place-items:center;flex:none}
.g-av svg{width:40px;display:block}
.g-av i{position:absolute;right:-7px;bottom:-7px;background:var(--g-pink);font:400 .75rem/1 var(--loud);font-style:normal;border-radius:8px;padding:3px 5px;border:2px solid var(--g-bg)}
.g-who{flex:1;min-width:0;display:grid;gap:4px}
.g-who b{font:400 1.1rem/1 var(--loud);letter-spacing:.01em}
.g-xp{height:7px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.g-xp i{display:block;width:68%;height:100%;background:linear-gradient(90deg,#7CFFB2,#4DE3FF)}
.g-who small{font-size:.72rem;opacity:.8}
.g-gems{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);border-radius:999px;padding:3px 3px 3px 9px;font:400 1.08rem/1 var(--loud)}
.gem{width:20px;height:20px;fill:#4DE3FF;stroke:#0A3D4D;stroke-width:1.5}
.g-plus{width:34px;height:34px;border-radius:50%;border:0;border-bottom:3px solid #1E8F5A;background:#3FD18A;color:#fff;font:400 1.35rem/1 var(--loud);cursor:pointer}
.g-toastslot{padding:0 12px}
.g-toastslot:empty{display:none}
.sim:not([inert]) .g-toastslot{position:sticky;top:8px;z-index:6;margin-bottom:10px}
.g-toast{display:flex;align-items:center;gap:10px;background:var(--g-pink);border-radius:16px;padding:8px 8px 8px 10px;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.g-toast p{flex:1;font-weight:700;font-size:.88rem;line-height:1.25}
.g-tav{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--g-pink);display:grid;place-items:center;font:400 1.1rem/1 var(--loud);flex:none}
.g-scene{position:relative;height:216px;overflow:hidden}
.g-sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.g-pet{position:absolute;left:50%;top:12px;width:124px;margin-left:-62px}
.g-pet svg{display:block;width:100%}
.sim .g-play{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:grid;justify-items:center;gap:2px;background:#3FD18A;color:#fff;border:0;border-bottom:5px solid #1E8F5A;border-radius:18px;padding:7px 38px 5px;font:400 1.6rem/1 var(--loud);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.22);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.g-play small{font:400 .72rem/1.1 var(--loud);opacity:.92}
.g-body{display:grid;gap:12px;padding:12px 12px 16px}
.g-card{background:var(--g-card);border-radius:18px;padding:12px;display:grid;gap:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.g-h{font:400 1.15rem/1.1 var(--loud);letter-spacing:.01em}
.g-dhead{display:flex;gap:10px;align-items:center}
.g-flame{font-size:2.1rem;line-height:1}
.g-dhead b{font:400 1.2rem/1.1 var(--loud)}
.g-dhead p{font-size:.86rem;opacity:.9;margin-top:2px}

.popup{position:absolute;z-index:40;left:calc(100% + .9rem);top:50%;transform:translateY(-50%);width:300px;pointer-events:none}

  .how{grid-template-columns:minmax(0,1fr);gap:1rem}
  .hero{grid-template-columns:minmax(0,1fr) 160px;gap:1.5rem}
}

  .scns{grid-template-columns:minmax(0,1fr)}

  .thumb{flex:none;width:104px;margin:1rem 0 1rem 1rem;border-radius:10px;overflow:hidden}

  .wt{grid-template-columns:minmax(0,1fr)}
}

  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-ill{display:none}
  .thumb{width:72px;margin:.9rem 0 .9rem .9rem}

  .phone{border-radius:30px;padding:0 6px 6px}
  .scroll{border-radius:24px}
  .stepper button{font-size:.92rem;gap:.4rem}
}

'about.p1':'BeWare is a proof of concept for an experiential approach to manipulation literacy. It was made to accompany a policy submission on the EU KIDS Act (COM(2026) 681 final). It has not been shown to work. It shows how the idea could look in practice.',
'about.h.priv':'Privacy','about.p.priv':'This page has no accounts, collects no data and stores nothing. Quiz scores exist only until you close the tab.',
'about.h.rule':'Design rule','about.p.rule':'Outside the simulations, this app tries not to use the tricks it teaches: no streaks, no countdowns, no rewards for coming back and no guilt-trip wording. The tiny grey text and loud colours inside the simulations are deliberate.',
'about.h.lang':'Languages','about.p.lang':'Available now: English and Swedish. The goal is to cover all official EU languages. Translations need review by native speakers.',
'about.h.a11y':'Accessibility','about.p.a11y':'Accessibility is a core requirement. The prototype uses semantic HTML, keyboard controls, visible focus and respects reduced motion. A formal check against WCAG (target level 2.2 AA) has not been done yet and is planned.',
'about.h.src':'Sources','about.p.src':'Each trick is linked to related sources: the KIDS Act proposal, Article 25 of the Digital Services Act, and Ofcom research categories. These links are indicative and still need to be verified against the original texts.',
'about.h.open':'Open items',
'about.open':['Formal WCAG check (keyboard, screen reader, contrast, zoom, touch targets).','Native-speaker review of Swedish; add the other official EU languages.','Age-appropriate wording for different age groups.','Parallel quiz versions and an independent evaluation.','Test with real teenagers and teachers.','Verify the source mapping for every trick.'],
/* patterns */
'p.streak.name':'Streak pressure','p.streak.why':'Losing something you have built makes you want to come back, even on days you do not enjoy it. Designers call this loss aversion.','p.streak.tip':'Ask: would I play today if there was no streak? Missing a day costs nothing real.',
'p.virtual_currency.name':'Virtual currency','p.virtual_currency.why':'Gems hide the real price. 1,000 gems feels like a number in a game, not €10. Packs rarely match prices exactly, so you end up with leftovers and buy again.','p.virtual_currency.tip':'Convert it: how many euros is this? Would you pay that in cash?',
'p.countdown.name':'Countdown timer','p.countdown.why':'A ticking clock makes you feel you must decide now. Often the timer restarts or the offer comes back.','p.countdown.tip':'A deal that is good today is usually good tomorrow. If it disappears you lose very little. Close it and decide later.',
'p.loot_box.name':'Loot chest (random reward)','p.loot_box.why':'You pay for a chance, not for a thing. Wins are random and near-misses (“so close!”) make you try again. Random rewards are also used in gambling.','p.loot_box.tip':'Check the odds if they are shown. Treat each chest as money gone, not as an investment.',
'p.social_proof.name':'Everyone else is doing it (FOMO)','p.social_proof.why':'Seeing others act makes it feel like the right choice, or like you are missing out. These messages are often automatic and may not be true.','p.social_proof.tip':'Ask who it is for. Would you still want it if nobody else did?',
'p.scarcity.name':'Scarcity claim','p.scarcity.why':'“Only 2 left!” makes you hurry. If the number is not real or never changes, it is pressure, not information.','p.scarcity.tip':'Check another shop or come back later. Real stock rarely vanishes just when you hesitate.',
'p.preselected.name':'Pre-ticked extra','p.preselected.why':'Most people do not change defaults. A box that is already ticked adds a cost unless you notice and untick it.','p.preselected.tip':'Read every ticked box before you pay. Untick what you did not choose.',
'p.confirmshaming.name':'Guilt-trip button','p.confirmshaming.why':'The “no” option is worded to make you feel silly or selfish. It turns a free choice into an emotional one.','p.confirmshaming.tip':'Ignore the wording. “No thanks” is a normal answer.',
'p.hidden_cost.name':'Hidden cost','p.hidden_cost.why':'“Free trial” is big. The price after the trial is tiny and grey. Many people forget to cancel and get charged.','p.hidden_cost.tip':'Find the price after the trial and the date you would be charged before you start. Set a reminder if you go ahead.',
'p.hard_cancel.name':'Hard to cancel','p.hard_cancel.why':'Signing up took one tap. Leaving takes many screens, new offers and small buttons. Each step is a chance for you to give up.','p.hard_cancel.tip':'Keep going: the small grey link is usually the real cancel button. Take screenshots as proof.',
'p.infinite_scroll.name':'Endless feed','p.infinite_scroll.why':'No bottom means no natural moment to stop. New posts load before you ask, so you keep going without deciding to.','p.infinite_scroll.tip':'Decide your stopping point first: a time or a number of posts. Use a timer outside the app.',
'p.variable_reward.name':'Random reward','p.variable_reward.why':'Sometimes refreshing shows something exciting, sometimes nothing. Not knowing makes you check again and again.','p.variable_reward.tip':'Notice the urge to check. Turn off notifications that are not important.',
'p.risky_default.name':'Risky default','p.risky_default.why':'Settings start open: anyone can see you or message you. Most people never change them.','p.risky_default.tip':'Check your privacy settings today. Choose the safest option, then open up only what you need.',

/* decisions */
'dec.game.1.q':'A pop-up says: “Starter pack −60%. Ends in 14:59!” A friend says it is a great deal. What do you do?',
'dec.game.1.o1':'Buy it before it ends.','dec.game.1.f1':'That is the countdown working. Offers like this often come back, and a timer is pressure, not a reason.',
'dec.game.1.o2':'Close it and decide tomorrow.','dec.game.1.f2':'If it is still a good deal tomorrow, you lose nothing by waiting. If it is gone, you lost very little.',
'dec.game.1.o3':'Ask: how many euros is this, and would I pay that for a game item?','dec.game.1.f3':'Converting gems into euros makes the real price visible again.',
'dec.game.2.q':'You have a 6-day streak. It is late and you are tired. The game says “Do not lose your streak!”',
'dec.game.2.o1':'Play for two minutes just to keep it.','dec.game.2.f1':'That is how streaks work: they turn something you chose into something you owe. Notice the pull.',
'dec.game.2.o2':'Skip it. A streak is worth nothing outside the game.','dec.game.2.f2':'You can start a new streak any time. Rest is worth more.',
'dec.game.2.o3':'Spend gems to freeze the streak.','dec.game.2.f3':'The game sells you a fix for a worry it created.',
'dec.shop.1.q':'At checkout a box is already ticked: “Add Care Plan (+€3.99)”. Your total is higher than you expected.',
'dec.shop.1.o1':'Pay anyway. It is only a few euros.','dec.shop.1.f1':'Small extras add up, and you did not choose this one. Pre-ticked boxes rely on people not looking.',
'dec.shop.1.o2':'Untick it and check the total.','dec.shop.1.f2':'Reading the boxes before you pay is the best habit here.',
'dec.shop.1.o3':'Assume the shop would not add something I did not want.','dec.shop.1.f3':'That is exactly what the default counts on. Check for yourself.',
'dec.shop.2.q':'You want to cancel a membership. The first screen offers 50% off.',
'dec.shop.2.o1':'Take the 50% off.','dec.shop.2.f1':'Only if you really want to keep it. The offer is there to make you stop cancelling.',
'dec.shop.2.o2':'Decline, keep going until it is cancelled, and screenshot the confirmation.','dec.shop.2.f2':'The confirmation is your proof if something goes wrong later.',
'dec.shop.2.o3':'Give up. It is too much work.','dec.shop.2.f3':'That is what the extra steps are designed to cause. The small link is usually there.',
'dec.social.1.q':'You have scrolled for 40 minutes without planning to. The feed keeps loading more.',
'dec.social.1.o1':'Scroll a bit more. There might be something good.','dec.social.1.f1':'That thought is what an endless feed is built to create. There is always one more post.',
'dec.social.1.o2':'Stop now and set a timer outside the app for next time.','dec.social.1.f2':'A stopping point you chose beats one the app never gives you.',
'dec.social.1.o3':'Delete the app forever.','dec.social.1.f3':'That is your call. You can also keep it and change settings, like turning off notifications you do not need.',
'dec.social.2.q':'Your profile is public and anyone can message you. That is how the app started out.',
'dec.social.2.o1':'Leave it. If it is the default, it must be fine.','dec.social.2.f1':'Defaults are chosen by the company, not for you. Check them.',
'dec.social.2.o2':'Change profile and messages to friends only.','dec.social.2.f2':'Start with the safest settings and open up only what you need.',
'dec.social.2.o3':'Look through the settings together with someone I trust.','dec.social.2.f3':'Talking it through with someone you trust is a smart way to check.',

'about.p1':'BeWare är ett proof of concept för ett upplevelsebaserat sätt att öva på att förstå manipulation. Det är gjort som komplement till ett policyyttrande om EU:s KIDS Act (COM(2026) 681 final). Det har inte visats fungera. Det visar hur idén kan se ut i praktiken.',
'about.h.priv':'Integritet','about.p.priv':'Sidan har inga konton, samlar ingen data och sparar ingenting. Testresultat finns bara tills du stänger fliken.',
'about.h.rule':'Designregel','about.p.rule':'Utanför simuleringarna försöker appen undvika tricken den lär ut: inga streaks, inga nedräkningar, inga belöningar för att komma tillbaka och inga dåligt-samvete-formuleringar. Den lilla grå texten och de skrikiga färgerna inuti simuleringarna är medvetna.',
'about.h.lang':'Språk','about.p.lang':'Tillgängligt nu: engelska och svenska. Målet är att täcka alla officiella EU-språk. Översättningarna behöver granskas av personer med språket som modersmål.',
'about.h.a11y':'Tillgänglighet','about.p.a11y':'Tillgänglighet är ett grundkrav. Prototypen använder semantisk HTML, tangentbordsstöd, synlig fokusmarkering och respekterar minskad rörelse. En formell kontroll mot WCAG (målnivå 2.2 AA) är inte gjord än och är planerad.',
'about.h.src':'Källor','about.p.src':'Varje trick är kopplat till relaterade källor: förslaget till KIDS Act, artikel 25 i förordningen om digitala tjänster (DSA) och Ofcoms forskningskategorier. Kopplingarna är vägledande och behöver fortfarande kontrolleras mot originaltexterna.',
'about.h.open':'Återstår',
'about.open':['Formell WCAG-kontroll (tangentbord, skärmläsare, kontrast, zoom, tryckytor).','Granskning av svenskan av någon med svenska som modersmål. Lägg till övriga officiella EU-språk.','Åldersanpassade formuleringar för olika åldersgrupper.','Parallella testversioner och en oberoende utvärdering.','Test med riktiga tonåringar och lärare.','Kontrollera källkopplingen för varje trick.'],
'p.streak.name':'Streak-press','p.streak.why':'Att förlora något du byggt upp gör att du vill komma tillbaka, även när du inte har lust. Designers kallar det förlustaversion.','p.streak.tip':'Fråga dig: skulle jag spela idag om det inte fanns någon streak? Att missa en dag kostar inget på riktigt.',
'p.virtual_currency.name':'Virtuell valuta','p.virtual_currency.why':'Juveler döljer det riktiga priset. 1 000 juveler känns som ett tal i ett spel, inte som 10 €. Paketen går sällan jämnt upp, så du får över juveler och köper mer.','p.virtual_currency.tip':'Räkna om: hur många euro är det? Skulle du betala det med kontanter?',
'p.countdown.name':'Nedräkning','p.countdown.why':'En tickande klocka får dig att känna att du måste välja nu. Ofta startar klockan om eller så kommer erbjudandet tillbaka.','p.countdown.tip':'Ett bra pris idag är oftast ett bra pris imorgon. Försvinner det förlorar du lite. Stäng ner det och bestäm senare.',
'p.loot_box.name':'Lootbox (slumpmässig belöning)','p.loot_box.why':'Du betalar för en chans, inte för en sak. Vinsterna är slumpmässiga och nästan-vinster (”så nära!”) får dig att försöka igen. Slumpmässiga belöningar används också i spel om pengar.','p.loot_box.tip':'Titta på oddsen om de visas. Se varje skrin som pengar som är borta, inte som en investering.',
'p.social_proof.name':'Alla andra gör det (FOMO)','p.social_proof.why':'När du ser andra göra något känns det som rätt val, eller som att du missar något. Meddelandena är ofta automatiska och behöver inte vara sanna.','p.social_proof.tip':'Fråga vem det är till för. Skulle du vilja ha det även om ingen annan ville?',
'p.scarcity.name':'Brist-påstående','p.scarcity.why':'”Bara 2 kvar!” får dig att skynda. Om siffran inte är riktig eller aldrig ändras är det press, inte information.','p.scarcity.tip':'Titta i andra butiker eller kom tillbaka senare. Riktigt lager försvinner sällan just när du tvekar.',
'p.preselected.name':'Förbockad extra','p.preselected.why':'De flesta ändrar inte standardvalen. En ruta som redan är ikryssad lägger till en kostnad om du inte märker den och bockar ur.','p.preselected.tip':'Läs varje ikryssad ruta innan du betalar. Bocka ur det du inte valt.',

const loc=()=>lang==='sv'?'sv-SE':'en-GB';
const fmt=n=>Number(n).toLocaleString(loc());
const eur=n=>new Intl.NumberFormat(lang==='sv'?'sv-SE':'en-IE',{style:'currency',currency:'EUR'}).format(n);
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- overlay: markers (step 1) and flag buttons (step 2) ---- */
function layout(){
  const wrap=$('#wrap'), ov=$('#ov'); if(!wrap||!ov||!ctx||S.step===0) return;
  const fk=document.activeElement&&ov.contains(document.activeElement)?document.activeElement.dataset.k:null;
  const wr=wrap.getBoundingClientRect(), def=SCEN[S.scn]; let h='';
  $$('[data-p],[data-fair]',$('.sim',wrap)).filter(e=>!e.hidden).forEach(el=>{
    const key=el.dataset.p||'fair', r=el.getBoundingClientRect(), edge=r.left-wr.left<12?' edge':'';
    const pos=`left:${r.left-wr.left}px;top:${r.top-wr.top}px;width:${r.width}px;height:${r.height}px`;
    if(S.step===1){
      h+=`<div class="mark${edge}${key==='fair'?' fair':''}${ctx.hl===key?' on':''}" data-k="${key}" style="${pos}"><span class="badge">${key==='fair'?'✓':def.patterns.indexOf(key)+1}</span></div>`;
    } else {
      const on=ctx.flags.has(key); let cls='hit'+edge,badge=on?'⚑':'',state='';
      if(ctx.checked){
        const trick=key!=='fair';
        if(trick&&on){cls+=' found';badge='✓';state=t('st.found');}
        else if(trick&&!on){cls+=' missed';badge='!';state=t('st.missed');}
        else if(!trick&&on){cls+=' wrong';badge='✗';state=t('st.wrong');}
        else {badge='';}
      } else if(on) cls+=' on';
      const txt=(el.dataset.lbl||el.textContent).replace(/\s+/g,' ').trim().slice(0,110);
      const label=ctx.checked?(state?`${state}: ${txt}`:txt):`${t('flag')} ${txt}`;
      h+=`<button type="button" class="${cls}" data-k="${key}" aria-pressed="${on}" aria-label="${esc(label)}" style="${pos}"${ctx.checked?' disabled':''}>${badge?`<span class="badge" aria-hidden="true">${badge}</span>`:''}</button>`;
    }
  });
  ov.innerHTML=h;
  if(fk){const f=ov.querySelector(`[data-k="${fk}"]`); f&&!f.disabled&&f.focus();}
}

const toView=el=>el&&el.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'});
function initGame(){
  const g=GV.a; let gems=g.gems, claimed=false, day=g.day;
  const setG=n=>{gems=n;$('#gemN').textContent=fmt(n);};
  let secs=g.secs; timers.push(setInterval(()=>{secs--; if(secs<0) secs=g.secs; const c=$('#cd'); if(c) c.textContent=mmss(secs);},1000));
  timers.push(setTimeout(()=>{const s=$('#toastSlot'); if(s&&!s.innerHTML) s.innerHTML=toastHTML('a');},7000));
  const chest=()=>{
    if(gems<g.chest) return say('gMsg',t('game.msg.poor',g.chest));
    setG(gems-g.chest); const r=Math.random(); let reels,msg;
    if(r<.06){reels='★ ★ ★';msg=t('game.win.legend',t('game.a.legend'));}
    else if(r<.34){reels='★ ★ •';msg=t('game.near');}
    else if(r<.6){reels='★ • ◆';msg=t('game.win.rare');}
    else {reels='• ◆ •';msg=t('game.win.common');}
    say('reels',reels); say('gMsg',msg);
  };
  simAPI={click(b){
    const a=b.dataset.act;
    if(a==='claim'){ if(claimed) return say('gMsg',t('game.msg.claimed')); claimed=true; setG(gems+50); day++; const td=$('.g-days .today'); if(td){td.className='done';td.querySelector('svg').outerHTML=`<span class="g-tick">${icon('check')}</span>`;} say('gMsg',t('game.msg.claim',day)); }
    else if(a==='offer'){ if(gems>=g.item){setG(gems-g.item);say('gMsg',t('game.msg.got',t('game.a.item')));} else say('gMsg',t('game.msg.need',fmt(g.item-gems))); }
    else if(a==='pack'){ const n=+b.dataset.n; setG(gems+n); say('gMsg',t('game.msg.pack',fmt(n))); }
    else if(a==='chest') chest();
    else if(a==='toshop') toView($('.g-shop'));
    else if(a==='play') say('gMsg',t('game.msg.play',g.lvl));
    else if(a==='break') say('gMsg',t('game.break.msg'));
    else if(a==='nav') say('nav',t('sim.nav'));
  }};
}
function initShop(){
  const s=SV.a; let joined=false, waitSeen=false;
  const upd=()=>{$('#total').textContent=eur(s.price+($('#addon').checked?s.addon:0));};
  const join=()=>{joined=true; $('#member').hidden=false; ctx.trig.add('hidden_cost'); say('sMsg',t('shop.msg.joined')); toView($('#member'));};
  const setStep=n=>{$('#mBody').innerHTML=memberStep(n); const f=$('#mstep'); f&&f.focus(); ctx.trig.add('hard_cancel');};
  simAPI={
    change(el){ if(el.id==='addon'){upd();} },
    click(b){
      const a=b.dataset.act;
      if(a==='join') join();
      else if(a==='buy'){ if(!joined&&!waitSeen){waitSeen=true;$('#wait').hidden=false;ctx.trig.add('confirmshaming');$('#wait').focus();} else say('sMsg',t('shop.msg.ordered')); }
      else if(a==='yes'){ $('#wait').hidden=true; join(); }
      else if(a==='no'){ $('#wait').hidden=true; say('sMsg',t('shop.msg.ordered')); }
      else if(a==='c1') setStep(1); else if(a==='c2') setStep(2); else if(a==='c3') setStep(3);
      else if(a==='ckeep'){ $('#mBody').innerHTML=memberStep(0); say('sMsg',t('shop.msg.kept')); }
      else if(a==='size'){ $$('.s-size').forEach(x=>x.setAttribute('aria-pressed',x===b)); }
      else if(a==='wish'){ const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); if(on) say('sMsg',t('shop.msg.wish')); }
      else if(a==='nav') say('nav',t('sim.nav'));

function viewAbout(m){
  const sec=(h,p)=>`<h2>${t(h)}</h2><p>${t(p)}</p>`;
  m.innerHTML=`<button type="button" class="back" data-go="home">← ${t('back')}</button><div class="prose"><h1 id="h1" tabindex="-1">${t('about.h')}</h1><p class="lead">${t('about.p1')}</p>
  ${sec('about.h.priv','about.p.priv')}${sec('about.h.rule','about.p.rule')}${sec('about.h.lang','about.p.lang')}${sec('about.h.a11y','about.p.a11y')}${sec('about.h.src','about.p.src')}
  <h2>${t('about.h.open')}</h2><ul>${tl('about.open').map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
}

/* ================= events ================= */
document.addEventListener('change',e=>{
  if(e.target.id==='langsel'){ lang=e.target.value; render(false); const s=$('#langsel'); s&&s.focus(); return; }
  if(S.view==='scn'&&S.step===0&&simAPI&&simAPI.change&&e.target.closest('#wrap')){
    const p=e.target.closest('[data-p]'); if(p) ctx.trig.add(p.dataset.p); simAPI.change(e.target);
  }
});
document.addEventListener('click',e=>{
  const T=e.target;
  if(T.closest('[data-popclose]')){ clearPopup(); return; }
  let b=T.closest('[data-go]'); if(b){ go(b.dataset.go); return; }
  b=T.closest('[data-scn]'); if(b){ go('scn',b.dataset.scn); return; }
  b=T.closest('[data-step]'); if(b&&!b.disabled){ S.step=+b.dataset.step; S.max=Math.max(S.max,S.step); render('#ph'); return; }
  b=T.closest('[data-hl]'); if(b){ ctx.hl=ctx.hl===b.dataset.hl?null:b.dataset.hl; $$('[data-hl]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.hl===ctx.hl)); layout(); if(ctx.hl){const mk=$(`.mark[data-k="${ctx.hl}"]`); mk&&mk.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'});} return; }
  b=T.closest('.hit'); if(b&&!b.disabled){ const k=b.dataset.k; ctx.flags.has(k)?ctx.flags.delete(k):ctx.flags.add(k); layout(); say('cnt',t('marked',ctx.flags.size)); return; }
  b=T.closest('[data-act2="check"]'); if(b){ ctx.checked=true; $('.panel').innerHTML=panel2(S.scn); refreshDecisions(); layout(); const r=$('#res'); r&&r.focus(); return; }
  b=T.closest('[data-dec]'); if(b){ const [i,j]=b.dataset.dec.split(':').map(Number); ctx.dec[i]=j; refreshDecisions(); return; }
  b=T.closest('[data-act3]'); if(b){
    const q=S.quiz;
    if(b.dataset.act3==='submit'){
      let all=true; QUIZ.forEach((it,i)=>{const c=document.querySelector(`input[name="q${i}"]:checked`); if(c) q.ans[i]=c.value; else {all=false; delete q.ans[i];}});
      if(!all){ q.err=true; render(false); const er=$('#qerr'); er&&er.scrollIntoView({block:'center'}); return; }
      q.err=false; const score=QUIZ.filter((it,i)=>q.ans[i]===it.a).length; if(q.pre===null) q.pre=score; q.last=score; q.show=true; render(); window.scrollTo(0,0);
    } else { q.show=false; q.ans={}; q.err=false; render(); window.scrollTo(0,0); }
    return;
  }
  if(S.view==='scn'&&S.step===0&&simAPI&&simAPI.click){
    const a=T.closest('#wrap [data-act]'); if(a){ const p=a.closest('[data-p]'); if(p) ctx.trig.add(p.dataset.p); simAPI.click(a); }
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') clearPopup(); });
window.addEventListener('resize',()=>layout());
render('');
})();
</script>
</body>
</html>
